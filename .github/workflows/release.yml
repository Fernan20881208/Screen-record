name: Publish v1.0.0

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify release build
        run: |
          gradle :app:testDebugUnitTest --stacktrace
          gradle :app:lintRelease --stacktrace
          gradle :app:assembleRelease --stacktrace

      - name: Collect universal APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          universal=$(find app/build/outputs/apk/release -maxdepth 1 -name '*universal*release.apk' | head -n1)
          test -n "$universal"
          cp "$universal" dist/Zaid-Screen-Recorder-v1.0.0-universal.apk

      - name: Build Magisk KernelSU privileged module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-module
          mkdir -p release-module/system/priv-app/ZaidScreenRecorder
          cp -a root-module/. release-module/
          cp dist/Zaid-Screen-Recorder-v1.0.0-universal.apk \
            release-module/system/priv-app/ZaidScreenRecorder/ZaidScreenRecorder.apk
          chmod 0755 release-module/customize.sh
          (cd release-module && zip -qr ../dist/Zaid-Screen-Recorder-v1.0.0-Privileged-AudioPolicy-Module.zip .)
          test -s dist/Zaid-Screen-Recorder-v1.0.0-Privileged-AudioPolicy-Module.zip

      - name: Write release notes
        shell: bash
        run: |
          cat > dist/RELEASE_NOTES.md <<'EOF'
          # Zaid Screen Recorder v1.0.0

          First public release.

          ## Audio
          - Internal audio does not use MediaProjection.
          - Uses privileged Android AudioPolicy with `AudioMix` route `LOOP_BACK | RENDER` and a Remote Submix `AudioRecord` sink.
          - Internal PCM and microphone PCM are read independently and mixed into one continuous AAC timeline.
          - Includes audio health diagnostics in `last-audio.log`.

          ## Root module
          Internal audio requires the included **Privileged AudioPolicy Module**. Flash the module in Magisk/KernelSU/APatch and reboot. The module installs the same release APK as `/system/priv-app/ZaidScreenRecorder` and supplies the privileged-permission allowlist.

          The standalone APK is included for inspection/installation, but Android will not grant the AudioPolicy capture permissions to a normal user-installed APK.

          ## Video
          - Root `/system/bin/screenrecord` backend.
          - Segment-based pause/resume.
          - MP4 validation and fast-start finalization.
          - Movable Liquid Glass recording controls.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'v1.0.0 already exists; leaving the published release unchanged.'
            exit 0
          fi
          gh release create v1.0.0 \
            dist/Zaid-Screen-Recorder-v1.0.0-universal.apk \
            dist/Zaid-Screen-Recorder-v1.0.0-Privileged-AudioPolicy-Module.zip \
            --target "$GITHUB_SHA" \
            --title "Zaid Screen Recorder v1.0.0" \
            --notes-file dist/RELEASE_NOTES.md
